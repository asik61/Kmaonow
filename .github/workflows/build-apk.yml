name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          cd android
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias realmoney \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass realmoney123 \
            -keypass realmoney123 \
            -dname "CN=Real Money App, OU=Mobile, O=RealMoneyApp, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Build Android APKs (Release & Debug)
        run: |
          cd android
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APKs for Download
        run: |
          mkdir -p final-apks
          # Copy release APK
          cp android/app/build/outputs/apk/release/*.apk final-apks/RealMoneyApp-release.apk || true
          # Copy debug APK
          cp android/app/build/outputs/apk/debug/*.apk final-apks/RealMoneyApp-debug.apk || true
          ls -la final-apks/

      - name: Upload Ready APK Files
        uses: actions/upload-artifact@v4
        with:
          name: RealMoneyApp-Android-APKs
          path: final-apks/*.apk
          retention-days: 30
