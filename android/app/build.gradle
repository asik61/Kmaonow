plugins {
    id 'com.android.application'
}

android {
    namespace 'online.realmoneyapp.app'
    compileSdk 34

    defaultConfig {
        applicationId "online.realmoneyapp.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "realmoney123"
            keyAlias System.getenv("KEY_ALIAS") ?: "realmoney"
            keyPassword System.getenv("KEY_PASSWORD") ?: "realmoney123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
