<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Rich Vibrant Emerald (Matches original splash icon) -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="35%" stop-color="#047857" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Gold Coin Gradient -->
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="80%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Gold Bevel Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Rising Growth Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="75%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="coinShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.65" />
    </filter>

    <filter id="glowShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#047857" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FACC15" flood-opacity="0.4" />
    </filter>

    <!-- Inner Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- 1. FULL-BLEED EMERALD ICON BASE (No outer extra box!) -->
  <rect width="512" height="512" fill="url(#emeraldBg)" />
  <rect x="6" y="6" width="500" height="500" stroke="url(#borderGrad)" stroke-width="8" fill="none" opacity="0.8" />

  <!-- 2. Glassmorphism Top Highlight Sheen -->
  <path d="M 0 0 L 512 0 L 512 160 C 512 240 380 280 256 280 C 120 280 0 240 0 160 Z" fill="url(#glossGrad)" />

  <!-- 3. Ambient Wealth Rings -->
  <circle cx="256" cy="256" r="190" stroke="#34D399" stroke-opacity="0.16" stroke-width="2.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" stroke="#6EE7B7" stroke-opacity="0.22" stroke-width="2.5" />

  <!-- 4. Dynamic Rising Growth Path (Behind Coin) -->
  <path d="M 96 376 Q 180 376 220 310 T 384 148" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glowShadow)" />
  
  <!-- Arrow Head -->
  <path d="M 324 138 L 400 136 L 402 212" fill="none" stroke="#FEF08A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowShadow)" />

  <!-- 5. 3D GOLDEN INDIAN RUPEE COIN (BIG & CENTERED) -->
  <g filter="url(#coinShadow)">
    <!-- Outer Gold Rim Base -->
    <circle cx="256" cy="266" r="118" fill="#854D0E" />
    <circle cx="256" cy="260" r="118" fill="url(#goldBevel)" />
    
    <!-- Coin Face Inner Dish -->
    <circle cx="256" cy="260" r="102" fill="url(#goldCoinGrad)" />
    <circle cx="256" cy="260" r="92" stroke="#FDE047" stroke-width="3" stroke-dasharray="6 4" fill="none" stroke-opacity="0.85" />

    <!-- Rupee '₹' 3D Shadow -->
    <g transform="translate(2, 4)" stroke="#78350F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 224 218 L 288 218" />
      <path d="M 224 244 L 282 244" />
      <path d="M 248 218 C 276 218, 288 230, 288 248 C 288 266, 268 276, 246 276 L 228 276" fill="none" />
      <path d="M 242 276 L 288 318" />
    </g>

    <!-- Rupee '₹' Main Golden White Sculpted Symbol -->
    <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 224 216 L 288 216" />
      <path d="M 224 242 L 282 242" />
      <path d="M 248 216 C 276 216, 288 228, 288 246 C 288 264, 268 274, 246 274 L 228 274" fill="none" />
      <path d="M 242 274 L 288 316" />
    </g>

    <!-- Subtle Bevel Inner Line -->
    <g stroke="#FEF08A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M 228 216 L 280 216" />
      <path d="M 228 242 L 276 242" />
    </g>
  </g>

  <!-- 6. Floating Sparkles / Diamond Stars of Prosperity -->
  <!-- Top Left Sparkle -->
  <path d="M 124 110 Q 124 130 104 130 Q 124 130 124 150 Q 124 130 144 130 Q 124 130 124 110 Z" fill="#FDE047" opacity="0.95" />
  <circle cx="124" cy="130" r="3.5" fill="#FFFFFF" />

  <!-- Bottom Right Sparkle -->
  <path d="M 408 360 Q 408 376 392 376 Q 408 376 408 392 Q 408 376 424 376 Q 408 376 408 360 Z" fill="#FEF08A" opacity="0.9" />

  <!-- Center Top Tiny Glint -->
  <circle cx="224" cy="174" r="4.5" fill="#FFFFFF" opacity="0.85" />
  <circle cx="346" cy="270" r="5.5" fill="#34D399" opacity="0.8" />
</svg>
