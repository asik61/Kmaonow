<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#047857"/>
      <stop offset="50%" stopColor="#059669"/>
      <stop offset="100%" stopColor="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" rx="28" fill="url(#rfBg)"/>

  <!-- Left Text -->
  <g transform="translate(70, 105)">
    <text x="0" y="0" fill="#FFFFFF" font-size="52" font-weight="900" font-family="system-ui, sans-serif">Refer &amp; <tspan fill="#FACC15">Earn</tspan></text>
    <text x="0" y="44" fill="#D1FAE5" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Invite your friends and get rewarded!</text>

    <!-- Referral Code Pill -->
    <g transform="translate(0, 75)">
      <rect width="260" height="42" rx="21" fill="#064E3B" opacity="0.85"/>
      <text x="130" y="27" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" font-family="system-ui, sans-serif">Your Code: <tspan fill="#34D399">KAMA1234</tspan></text>
    </g>

    <!-- Invite Now Button -->
    <g transform="translate(0, 130)">
      <rect width="190" height="50" rx="25" fill="#FFFFFF"/>
      <text x="95" y="32" text-anchor="middle" fill="#047857" font-size="20" font-weight="900" font-family="system-ui, sans-serif">Invite Now →</text>
    </g>
  </g>

  <!-- Right: Characters holding smartphone with K logo -->
  <g transform="translate(680, 180)">
    <!-- Boy Left -->
    <g transform="translate(-70, -20)">
      <circle cx="0" cy="-30" r="38" fill="#FED7AA"/>
      <path d="M-36 -35 C-36 -70 -10 -78 10 -72 C32 -65 36 -45 36 -30 Z" fill="#0F172A"/>
      <ellipse cx="-12" cy="-32" rx="5" ry="7" fill="#0F172A"/>
      <ellipse cx="14" cy="-32" rx="5" ry="7" fill="#0F172A"/>
      <path d="M-8 -12 Q0 0 10 -12" stroke="#DC2626" stroke-width="3" fill="none"/>
      <!-- Green Hoodie -->
      <path d="M-45 30 C-45 -10 -25 -20 0 -20 C25 -20 45 -10 45 30 L55 80 L-55 80 Z" fill="#0284C7"/>
    </g>

    <!-- Girl Right -->
    <g transform="translate(70, -10)">
      <circle cx="0" cy="-25" r="36" fill="#FED7AA"/>
      <!-- Ponytail Hair -->
      <path d="M-34 -30 C-34 -65 0 -72 25 -65 C40 -50 42 -30 36 -15 Z" fill="#78350F"/>
      <ellipse cx="38" cy="-10" rx="14" ry="24" fill="#78350F"/>
      <ellipse cx="-12" cy="-28" rx="5" ry="6" fill="#0F172A"/>
      <ellipse cx="12" cy="-28" rx="5" ry="6" fill="#0F172A"/>
      <path d="M-6 -10 Q0 2 8 -10" stroke="#DC2626" stroke-width="3" fill="none"/>
      <!-- Yellow Shirt -->
      <path d="M-40 30 C-40 -5 -20 -15 0 -15 C20 -15 40 -5 40 30 L48 80 L-48 80 Z" fill="#F59E0B"/>
    </g>

    <!-- Smartphone in center -->
    <g transform="translate(0, 10)">
      <rect x="-35" y="-70" width="70" height="120" rx="12" fill="#0F172A" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-30" y="-62" width="60" height="104" rx="8" fill="#10B981"/>
      <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="900" font-family="system-ui, sans-serif">K</text>
      <rect x="-24" y="14" width="48" height="18" rx="4" fill="#064E3B"/>
      <text x="0" y="27" text-anchor="middle" fill="#A7F3D0" font-size="9" font-weight="800" font-family="sans-serif">KAMA1234</text>
    </g>
  </g>
</svg>
