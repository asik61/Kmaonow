<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C2410C"/>
      <stop offset="50%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" rx="28" fill="url(#scBg)"/>

  <!-- Left Text -->
  <g transform="translate(70, 110)">
    <text x="0" y="0" fill="#FFFFFF" font-size="52" font-weight="900" font-family="system-ui, sans-serif">Scratch &amp; <tspan fill="#FEF08A">Win</tspan></text>
    <text x="0" y="44" fill="#FFEDD5" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Scratch the card &amp; reveal your reward!</text>
    
    <!-- Scratch Now Button -->
    <g transform="translate(0, 110)">
      <rect width="220" height="54" rx="27" fill="#FACC15"/>
      <text x="110" y="34" text-anchor="middle" fill="#7C2D12" font-size="22" font-weight="900" font-family="system-ui, sans-serif">Scratch Now →</text>
    </g>
  </g>

  <!-- Right: 3D Scratch Card & Hand -->
  <g transform="translate(680, 180)">
    <!-- Shadow -->
    <ellipse cx="0" cy="120" rx="130" ry="22" fill="#000000" opacity="0.3"/>

    <!-- Tilted Red Golden Framed Card -->
    <g transform="rotate(-6)">
      <rect x="-110" y="-85" width="220" height="170" rx="16" fill="#DC2626" stroke="#FEF08A" stroke-width="5"/>
      <rect x="-95" y="-70" width="190" height="140" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
      
      <!-- Scratched Effect (Silver surface partially rubbed away) -->
      <path d="M-80 -40 Q-40 0 10 -30 Q50 -50 80 -10 L70 40 Q20 50 -40 20 Z" fill="#F87171" opacity="0.85"/>
      <text x="-5" y="10" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="900" font-family="system-ui, sans-serif">₹ 50</text>
    </g>

    <!-- Hand Scratching with Finger -->
    <g transform="translate(30, 20)">
      <ellipse cx="50" cy="40" rx="36" ry="24" fill="#FDBA74" stroke="#EA580C" stroke-width="2"/>
      <!-- Pointing Index Finger -->
      <path d="M20 30 C5 15 -10 -5 -25 -20 C-32 -26 -40 -18 -34 -10 C-20 8 -5 28 10 45 Z" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
      <!-- Blue Cuff -->
      <rect x="70" y="20" width="30" height="42" rx="6" fill="#0284C7"/>
    </g>

    <!-- Floating Coins -->
    <circle cx="-135" cy="-35" r="16" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="130" cy="-60" r="20" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
  </g>
</svg>
