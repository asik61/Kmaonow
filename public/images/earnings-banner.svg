<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00632C"/>
      <stop offset="50%" stopColor="#004D22"/>
      <stop offset="100%" stopColor="#003B19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF066"/>
      <stop offset="35%" stopColor="#FFD700"/>
      <stop offset="70%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="50%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" floodColor="#000000" floodOpacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with green border -->
  <rect width="960" height="380" rx="32" fill="url(#bg)" stroke="#00C853" stroke-width="8"/>
  <ellipse cx="480" cy="30" rx="440" ry="120" fill="#00E676" opacity="0.08"/>

  <!-- Left Coin -->
  <g transform="translate(115, 190)">
    <g stroke="#FACC15" stroke-width="7" stroke-linecap="round">
      <line x1="-14" y1="-85" x2="-8" y2="-102"/>
      <line x1="-72" y1="-55" x2="-88" y2="-68"/>
      <line x1="-72" y1="55" x2="-88" y2="68"/>
      <line x1="78" y1="-42" x2="94" y2="-52" opacity="0.4"/>
    </g>
    <circle cx="0" cy="0" r="56" fill="url(#gold)" stroke="#CA8A04" stroke-width="4.5" filter="url(#cShadow)"/>
    <circle cx="0" cy="0" r="48" fill="url(#face)" stroke="#FDE047" stroke-width="3"/>
    <circle cx="0" cy="0" r="43" fill="none" stroke="#CA8A04" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="17" text-anchor="middle" fill="#FFFFFF" font-size="52" font-weight="900" font-family="system-ui, sans-serif">₹</text>
  </g>

  <!-- Center Text -->
  <g transform="translate(205, 130)">
    <text x="0" y="0" fill="#FFFFFF" font-size="48" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="0.2">Your Earnings</text>
    <g transform="translate(0, 105)">
      <text x="0" y="0" fill="#FFFFFF" font-size="94" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-1">₹ 24.75</text>
    </g>
  </g>

  <!-- Right Boy Character & Coins -->
  <g transform="translate(775, 165)">
    <!-- Celebration Rays -->
    <g stroke="#22C55E" stroke-width="6.5" stroke-linecap="round">
      <line x1="-75" y1="-95" x2="-88" y2="-110"/>
      <line x1="-38" y1="-128" x2="-44" y2="-145"/>
      <line x1="28" y1="-132" x2="36" y2="-148"/>
      <line x1="95" y1="-95" x2="112" y2="-110"/>
      <line x1="118" y1="-40" x2="135" y2="-48"/>
    </g>

    <!-- Character -->
    <g transform="translate(32, -12)">
      <path d="M-92 110 C-92 50 -48 30 0 30 C48 30 92 50 92 110 L102 145 L-102 145 Z" fill="#15803D" stroke="#14532D" stroke-width="4"/>
      <polygon points="-18,45 18,45 0,72" fill="#FFFFFF"/>
      <path d="M-24 38 Q0 55 24 38" stroke="#4ADE80" stroke-width="4" fill="none" stroke-linecap="round"/>
      <line x1="-9" y1="48" x2="-9" y2="75" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="9" y1="48" x2="9" y2="75" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-15" y="10" width="30" height="28" fill="#FDBA74"/>
      <ellipse cx="0" cy="-14" rx="49" ry="46" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
      <ellipse cx="-47" cy="-14" rx="9" ry="12" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
      <ellipse cx="47" cy="-14" rx="9" ry="12" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
      <path d="M-30 -18 Q-20 -28 -9 -18" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="19" cy="-17" rx="8.5" ry="10.5" fill="#0F172A"/>
      <circle cx="17" cy="-20" r="3.5" fill="#FFFFFF"/>
      <circle cx="22" cy="-13" r="1.5" fill="#FFFFFF"/>
      <path d="M-32 -30 Q-22 -36 -9 -32" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M9 -32 Q22 -36 32 -30" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M-13 6 Q0 26 15 6 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
      <path d="M-7 17 Q0 24 9 17 Z" fill="#FCA5A5"/>
      <ellipse cx="-30" cy="-2" rx="7.5" ry="4" fill="#F87171" opacity="0.6"/>
      <ellipse cx="30" cy="-2" rx="7.5" ry="4" fill="#F87171" opacity="0.6"/>
      <path d="M-47 -22 C-49 -64 -22 -76 0 -76 C27 -76 51 -62 47 -22 C41 -42 27 -55 11 -53 C22 -45 17 -32 6 -38 C-4 -51 -23 -47 -32 -32 C-38 -24 -40 -16 -47 -22 Z" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
      <!-- Victory Fist -->
      <g transform="translate(-82, -18)">
        <path d="M24 70 C16 48 11 22 20 0 C28 -6 41 -6 48 8 C41 27 34 54 32 75 Z" fill="#15803D" stroke="#14532D" stroke-width="3"/>
        <ellipse cx="24" cy="-4" rx="15" ry="16" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
        <path d="M13 -9 Q22 -15 30 -9 M15 -3 Q24 -9 32 -3 M17 3 Q26 -1 34 3" stroke="#EA580C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Coins Stack -->
    <g transform="translate(-16, 34)">
      <g transform="translate(-44, 22)">
        <ellipse cx="0" cy="20" rx="24" ry="8" fill="#CA8A04"/>
        <rect x="-24" y="7" width="48" height="13" fill="#EAB308"/>
        <ellipse cx="0" cy="7" rx="24" ry="8" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
      </g>
      <g transform="translate(48, 28)">
        <rect x="-22" y="9" width="44" height="13" fill="#EAB308"/>
        <ellipse cx="0" cy="9" rx="22" ry="7.5" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
      </g>
      <g transform="translate(9, 24)">
        <circle cx="0" cy="0" r="35" fill="url(#gold)" stroke="#CA8A04" stroke-width="3.5" filter="url(#cShadow)"/>
        <circle cx="0" cy="0" r="28" fill="url(#face)" stroke="#FDE047" stroke-width="2.5"/>
        <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-size="33" font-weight="900" font-family="sans-serif">₹</text>
      </g>
    </g>
  </g>

  <!-- View History Button -->
  <g transform="translate(755, 315)">
    <rect x="-150" y="-28" width="300" height="56" rx="28" fill="#FFFFFF"/>
    <text x="-16" y="9" text-anchor="middle" fill="#014D25" font-size="30" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="0.2">View History</text>
    <path d="M80 -7 L90 3 L80 13" stroke="#014D25" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
